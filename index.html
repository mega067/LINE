<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama Estructurado: Calificaciones Neón</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes y Animaciones -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        
        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f3ff; 
        }

        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTES VISUALES --- //

        const Arrow = ({ className, direction = "down" }) => {
            const rotations = { down: 0, right: -90, left: 90, up: 180 };
            return (
                <svg className={`w-6 h-6 ${className}`} style={{transform: `rotate(${rotations[direction]}deg)`}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
            );
        };

        const FlowBlock = ({ type, title, content, color, active }) => {
            const baseClass = `relative p-4 rounded-lg border-2 transition-all duration-300 font-code text-xs md:text-sm text-center z-10`;
            const colorClasses = {
                blue: 'border-[#00f3ff] text-[#00f3ff] shadow-[0_0_10px_#00f3ff]',
                green: 'border-[#00ff00] text-[#00ff00] shadow-[0_0_10px_#00ff00]',
                pink: 'border-[#ff00ff] text-[#ff00ff] shadow-[0_0_10px_#ff00ff]',
                gray: 'border-gray-600 text-gray-400'
            }[color] || 'border-gray-600';

            const activeClass = active ? colorClasses : 'border-gray-800 text-gray-600 opacity-60 grayscale';
            const scaleClass = active ? 'scale-105 bg-black' : 'bg-black';

            if (type === 'decision') {
                return (
                    <div className={`w-28 h-28 flex items-center justify-center transform rotate-45 border-2 ${active ? 'border-yellow-400 bg-yellow-900/10 text-yellow-300 shadow-[0_0_15px_rgba(250,204,21,0.3)]' : 'border-gray-700 text-gray-500'} m-4 transition-all duration-300`}>
                        <div className="transform -rotate-45 text-center text-xs">
                            <div className="font-bold mb-1">?</div>
                            {content}
                        </div>
                    </div>
                );
            }

            return (
                <div className={`${baseClass} ${activeClass} ${scaleClass}`}>
                    <div className="font-bold mb-1 border-b border-white/10 pb-1 text-[10px] uppercase tracking-wider">{title}</div>
                    <div>{content}</div>
                </div>
            );
        };

        const CodeSnippet = ({ title, lines, activeLines = [] }) => (
            <div className="font-code text-xs bg-[#080808] border border-gray-800 p-4 rounded-lg shadow-lg min-w-[280px] relative overflow-hidden group h-full">
                <div className="absolute top-0 left-0 w-1 h-full bg-[#00f3ff]"></div>
                <div className="text-gray-500 mb-3 border-b border-gray-800 pb-1 flex justify-between items-center">
                    <span className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-red-500"></span>
                        <span className="w-2 h-2 rounded-full bg-yellow-500"></span>
                        <span className="w-2 h-2 rounded-full bg-green-500"></span>
                    </span>
                    <span className="text-[#00f3ff] opacity-70 text-[10px]">{title}</span>
                </div>
                <div className="space-y-1 overflow-x-auto">
                    {lines.map((line, i) => (
                        <div key={i} className={`px-2 py-0.5 rounded transition-colors ${activeLines.includes(i) ? 'bg-[#00f3ff]/10 border-l-2 border-[#00f3ff]' : 'text-gray-500'}`}>
                            <span className="mr-3 text-gray-700 select-none text-[10px]">{i + 1}</span>
                            <span dangerouslySetInnerHTML={{__html: line}} />
                        </div>
                    ))}
                </div>
            </div>
        );

        const App = () => {
            const [step, setStep] = useState(0);

            // Datos
            const N = 8;
            const Arre = [10, 5, 8, 4, 6, 9, 5, 8];
            const S = Arre.reduce((a,b) => a+b, 0);
            const Pro = Math.floor(S / N);
            
            const nextStep = () => setStep(prev => Math.min(prev + 1, 4));
            const prevStep = () => setStep(prev => Math.max(prev - 1, 0));

            // Configuración de Código C para cada paso
            const cCodeMap = {
                0: {
                    title: "main.c - Declaración",
                    lines: [
                        '<span class="text-purple-400">int</span> N;',
                        '<span class="text-purple-400">int</span> Arre[1000]; <span class="text-gray-500">// Reserva Memoria</span>',
                        '<span class="text-purple-400">int</span> S = 0;',
                        '<span class="text-purple-400">int</span> A_pro = 0;',
                        '<span class="text-purple-400">float</span> P_A = 0;',
                    ],
                    active: [0, 1, 2, 3, 4]
                },
                1: {
                    title: "main.c - Entrada",
                    lines: [
                        '<span class="text-yellow-300">printf</span>(<span class="text-green-400">"Define N:"</span>);',
                        '<span class="text-yellow-300">scanf</span>(<span class="text-green-400">"%d"</span>, &N);',
                        '<span class="text-gray-500">// N define el límite del bucle</span>',
                    ],
                    active: [1]
                },
                2: {
                    title: "main.c - Bucle & Suma",
                    lines: [
                        '<span class="text-purple-400">for</span> (i=1; i <= N; i++) {',
                        '&nbsp;&nbsp;<span class="text-yellow-300">scanf</span>(<span class="text-green-400">"%d"</span>, &C);',
                        '&nbsp;&nbsp;Arre[i-1] = C;',
                        '&nbsp;&nbsp;S = S + C; <span class="text-gray-500">// Acumulador</span>',
                        '}'
                    ],
                    active: [0, 1, 2, 3]
                },
                3: {
                    title: "main.c - Condicional",
                    lines: [
                        '<span class="text-gray-500">// Dentro del bucle for...</span>',
                        '<span class="text-purple-400">if</span> ( C >= 6 ) {',
                        '&nbsp;&nbsp;A_pro = A_pro + 1;',
                        '} <span class="text-purple-400">else</span> {',
                        '&nbsp;&nbsp;No_pro = No_pro + 1;',
                        '}'
                    ],
                    active: [1, 2, 3, 4]
                },
                4: {
                    title: "main.c - Salida",
                    lines: [
                        'Pro = S / N;',
                        '<span class="text-yellow-300">printf</span>(<span class="text-green-400">"Promedio: %d"</span>, Pro);',
                        'P_A = ((<span class="text-purple-400">float</span>)A_pro / N) * 100;',
                        '<span class="text-yellow-300">printf</span>(<span class="text-green-400">"Aprobados: %f%%"</span>, P_A);',
                        '<span class="text-purple-400">return</span> 0;'
                    ],
                    active: [0, 1, 2, 3]
                }
            };

            return (
                <div className="flex-1 flex flex-col h-screen bg-[#050505] text-white overflow-hidden relative font-sans selection:bg-[#00f3ff] selection:text-black">
                    <div className="cyber-grid absolute inset-0 pointer-events-none opacity-20"></div>

                    {/* HEADER */}
                    <header className="p-4 border-b border-gray-800 bg-[#0a0a0a] flex justify-between items-center z-20 shadow-md">
                        <div className="flex items-center gap-3">
                            <div className="w-3 h-3 rounded-full bg-[#00f3ff] animate-pulse shadow-[0_0_10px_#00f3ff]"></div>
                            <h1 className="font-cyber text-lg md:text-2xl tracking-widest text-white">
                                C_VISUALIZER<span className="text-[#00f3ff]">.EXE</span>
                            </h1>
                        </div>
                        <div className="flex gap-2 items-center">
                             <button onClick={prevStep} disabled={step===0} className="px-3 py-1 border border-gray-700 rounded hover:bg-gray-800 disabled:opacity-30 font-code text-xs transition-colors">◄ PREV</button>
                             <div className="px-4 py-1 bg-black border border-[#00f3ff] rounded text-[#00f3ff] font-code font-bold text-xs shadow-[0_0_10px_rgba(0,243,255,0.2)]">
                                STEP {step}/4
                             </div>
                             <button onClick={nextStep} disabled={step===4} className="px-3 py-1 border border-gray-700 rounded hover:bg-gray-800 disabled:opacity-30 font-code text-xs transition-colors">NEXT ►</button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative p-4 md:p-8 gap-6 flex-col lg:flex-row">
                        
                        {/* ZONA DE CÓDIGO C (Dinámico) */}
                        <div className="lg:w-1/3 flex flex-col z-10 animate-[fadeIn_0.3s]">
                            <div className="mb-2 flex items-center gap-2">
                                <div className="w-2 h-2 bg-yellow-500 rounded-full"></div>
                                <h3 className="text-gray-400 font-cyber text-xs tracking-wider">CÓDIGO FUENTE ACTIVO</h3>
                            </div>
                            <CodeSnippet 
                                title={cCodeMap[step].title} 
                                lines={cCodeMap[step].lines} 
                                activeLines={cCodeMap[step].active} 
                            />
                            
                            {/* Panel de Variables (Pequeño debug) */}
                            <div className="mt-4 border border-gray-800 bg-black/50 p-4 rounded-lg font-code text-xs text-gray-400">
                                <div className="text-[#00f3ff] mb-2 border-b border-gray-800 pb-1">MEMORY_DUMP</div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>N = <span className="text-white">{step > 0 ? N : '?'}</span></div>
                                    <div>S = <span className="text-white">{step > 1 ? S : '0'}</span></div>
                                    <div>A_pro = <span className="text-white">{step > 2 ? Arre.filter(x=>x>=6).length : '0'}</span></div>
                                    <div>Pro = <span className="text-white">{step === 4 ? Pro : '?'}</span></div>
                                </div>
                            </div>
                        </div>

                        {/* ZONA DE VISUALIZACIÓN (Diagramas) */}
                        <div className="flex-1 bg-[#0a0a0a] border border-gray-800 rounded-xl relative flex flex-col items-center justify-center p-4 shadow-inner overflow-hidden">
                            <div className="absolute top-2 right-2 text-gray-600 font-cyber text-[10px]">RENDER_MODE: DIAGRAM</div>

                            {/* ARRAY STRIP (Visible siempre para contexto) */}
                            <div className="absolute top-0 left-0 w-full p-4 flex justify-center bg-gradient-to-b from-black to-transparent z-0">
                                <div className="flex gap-1">
                                    {Arre.map((val, idx) => (
                                        <div key={idx} className={`w-6 h-8 border rounded flex items-center justify-center text-[10px] font-code transition-all
                                            ${step === 0 ? 'border-gray-800 text-gray-800' : 'border-gray-700 text-gray-500'}
                                            ${(step === 2 || step === 3) ? 'border-[#00f3ff] text-white shadow-[0_0_5px_#00f3ff]' : ''}
                                            ${step === 4 ? (val >= 6 ? 'bg-green-900/20 border-green-500 text-green-400' : 'bg-red-900/20 border-red-500 text-red-400') : ''}
                                        `}>
                                            {step === 0 ? '0' : val}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* CONTENIDO PRINCIPAL ANIMADO */}
                            <div className="mt-12 w-full flex items-center justify-center">
                                
                                {/* PASO 0: MEMORIA */}
                                {step === 0 && (
                                    <div className="flex flex-col items-center animate-[fadeIn_0.5s]">
                                        <FlowBlock 
                                            title="RAM ALLOCATION" 
                                            content="Reservando 1000 espacios para enteros" 
                                            color="blue" 
                                            active={true} 
                                        />
                                        <div className="mt-4 grid grid-cols-10 gap-1 opacity-50">
                                            {[...Array(20)].map((_,i) => <div key={i} className="w-2 h-2 bg-gray-700 rounded-sm"></div>)}
                                        </div>
                                        <p className="mt-2 text-xs text-gray-500 font-code">...Espacio reservado...</p>
                                    </div>
                                )}

                                {/* PASO 1: INPUT */}
                                {step === 1 && (
                                    <div className="flex flex-col items-center animate-[fadeIn_0.5s]">
                                        <div className="font-code text-sm text-yellow-300 mb-2">> _</div>
                                        <FlowBlock 
                                            title="USER INPUT" 
                                            content={`scanf("%d", &N) -> ${N}`} 
                                            color="green" 
                                            active={true} 
                                        />
                                        <Arrow className="text-gray-600 my-2" />
                                        <div className="border border-dashed border-gray-600 p-2 rounded text-xs text-gray-400">
                                            Configurando bucle para {N} iteraciones
                                        </div>
                                    </div>
                                )}

                                {/* PASO 2: BUCLE */}
                                {step === 2 && (
                                    <div className="flex items-center gap-4 md:gap-8 animate-[fadeIn_0.5s]">
                                        <div className="flex flex-col items-center">
                                            <div className="text-[#00f3ff] text-xs mb-2 font-cyber">READ(C)</div>
                                            <div className="w-14 h-14 border-2 border-[#00f3ff] bg-[#00f3ff]/10 rounded flex items-center justify-center text-xl font-bold text-white shadow-[0_0_15px_rgba(0,243,255,0.3)]">
                                                {Arre[2]}
                                            </div>
                                        </div>
                                        
                                        <div className="h-0.5 w-12 bg-gray-700 relative overflow-hidden">
                                            <div className="absolute top-0 left-0 h-full w-1/2 bg-[#00f3ff] animate-[dash_1s_infinite]"></div>
                                        </div>
                                        
                                        <FlowBlock 
                                            title="SUMATORIA" 
                                            content={`S = S + ${Arre[2]}`} 
                                            color="blue" 
                                            active={true} 
                                        />
                                    </div>
                                )}

                                {/* PASO 3: CONDICIONAL */}
                                {step === 3 && (
                                    <div className="flex flex-col items-center animate-[fadeIn_0.5s]">
                                        <div className="mb-2 text-xs text-gray-400 font-code">Valor actual: <span className="text-white font-bold">{Arre[2]}</span></div>
                                        
                                        <FlowBlock type="decision" content="C >= 6" active={true} />
                                        
                                        <div className="flex gap-16 relative -mt-4 z-0">
                                            {/* Rama SI */}
                                            <div className="flex flex-col items-center">
                                                <div className="h-12 w-0.5 bg-green-500 mb-2"></div>
                                                <FlowBlock title="TRUE" content="A_pro++" color="green" active={true} />
                                            </div>

                                            {/* Rama NO (Inactiva visualmente para el ejemplo 8) */}
                                            <div className="flex flex-col items-center opacity-30 grayscale">
                                                <div className="h-12 w-0.5 bg-red-500 mb-2"></div>
                                                <FlowBlock title="FALSE" content="No_pro++" color="gray" active={false} />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* PASO 4: RESULTADO */}
                                {step === 4 && (
                                    <div className="w-full max-w-lg grid grid-cols-2 gap-4 animate-[zoomIn_0.5s]">
                                        <div className="col-span-2 text-center mb-2">
                                            <h2 className="text-xl font-cyber text-white">SYSTEM OUTPUT</h2>
                                        </div>
                                        
                                        <div className="border border-[#00f3ff] bg-[#00f3ff]/5 p-4 rounded text-center">
                                            <div className="text-[10px] text-[#00f3ff] mb-1">PROMEDIO</div>
                                            <div className="text-2xl font-bold">{Pro}</div>
                                            <div className="text-[9px] text-gray-500 font-code">S / N</div>
                                        </div>

                                        <div className="border border-[#ff00ff] bg-[#ff00ff]/5 p-4 rounded text-center">
                                            <div className="text-[10px] text-[#ff00ff] mb-1">% APROBACIÓN</div>
                                            <div className="text-2xl font-bold">{((Arre.filter(x=>x>=6).length/N)*100).toFixed(0)}%</div>
                                            <div className="text-[9px] text-gray-500 font-code">printf("%f", P_A)</div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
