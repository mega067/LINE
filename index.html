<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Árbol Binario</title>
    <!-- Incluimos Tailwind CSS para estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos personalizados para el árbol */
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; /* Evitar scroll horizontal */
        }
        
        /* Hemos eliminado todo el CSS anterior para .tree, .node, .node-line 
           y todas las clases de posicionamiento (.node-a, .line-ab, etc.) 
           porque el SVG ahora maneja toda la visualización.
        */

        /* Estilos para los elementos dentro del SVG */
        .svg-line {
            stroke: #6B7280; /* Gris (Tailwind gray-500) */
            stroke-width: 3;
        }
        .svg-node {
            fill: #10B981; /* Verde (Tailwind green-500) */
            stroke: #047857; /* Verde oscuro (green-700) */
            stroke-width: 3;
        }
        .svg-text {
            /* Usamos la fuente del body */
            font-family: inherit; 
            font-size: 24px;
            font-weight: 600;
            fill: white;
            text-anchor: middle; /* Centra el texto horizontalmente */
            dominant-baseline: central; /* Centra el texto verticalmente */
            pointer-events: none; /* Evita que el texto interfiera con clics */
        }

    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-xl p-6 md:p-10">
        
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-4">
            🌳 Representación de Árbol Binario (7 Nodos)
        </h1>
        <p class="text-center text-gray-600 mb-8">
            Visualización de un árbol binario completo y sus componentes clave.
        </p>

        <!-- 
          Contenedor del Árbol (Reemplazado con SVG) 
          
          - viewBox define nuestro "lienzo" (0 0 800 400).
          - preserveAspectRatio="xMidYMid meet" asegura que escale correctamente.
          - width="100%" y max-w-xl lo hacen responsivo.
        -->
        <svg 
             id="binary-tree-svg" 
             viewBox="0 0 800 400" 
             preserveAspectRatio="xMidYMid meet"
             class="w-full max-w-xl mx-auto"
             style="height: 350px;">
            
            <!-- Grupo de Líneas (dibujadas primero para quedar detrás) -->
            <g id="lines">
                <!-- A -> B -->
                <line class="svg-line" x1="400" y1="50" x2="200" y2="175"></line>
                <!-- A -> C -->
                <line class="svg-line" x1="400" y1="50" x2="600" y2="175"></line>
                <!-- B -> D -->
                <line class="svg-line" x1="200" y1="175" x2="100" y2="300"></line>
                <!-- B -> E -->
                <line class="svg-line" x1="200" y1="175" x2="300" y2="300"></line>
                <!-- C -> F -->
                <line class="svg-line" x1="600" y1="175" x2="500" y2="300"></line>
                <!-- C -> G -->
                <line class="svg-line" x1="600" y1="175" x2="700" y2="300"></line>
            </g>
            
            <!-- Grupo de Nodos (círculos + texto) -->
            <g id="nodes">
                <!-- Nivel 0: A -->
                <g transform="translate(400, 50)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">A</text>
                </g>
                <!-- Nivel 1: B, C -->
                <g transform="translate(200, 175)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">B</text>
                </g>
                <g transform="translate(600, 175)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">C</text>
                </g>
                <!-- Nivel 2: D, E, F, G -->
                <g transform="translate(100, 300)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">D</text>
                </g>
                <g transform="translate(300, 300)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">E</text>
                </g>
                <g transform="translate(500, 300)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">F</text>
                </g>
                <g transform="translate(700, 300)">
                    <circle class="svg-node" r="25"></circle>
                    <text class="svg-text">G</text>
                </g>
            </g>
        </svg>

        <!-- Sección de Identificación (Sin cambios) -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <h2 class="text-2xl font-semibold text-center mb-6">
                📊 Identificación de Componentes
            </h2>
            
            <div class="grid md:grid-cols-3 gap-6 text-center">
                
                <!-- Raíz -->
                <div class="bg-blue-50 p-5 rounded-lg shadow-sm border border-blue-200">
                    <h3 class="text-lg font-semibold text-blue-800 mb-2">Raíz</h3>
                    <p class="text-3xl font-bold text-blue-600">A</p>
                    <p class="text-sm text-gray-600 mt-2">El nodo superior del árbol.</p>
                </div>
                
                <!-- Hojas -->
                <div class="bg-green-50 p-5 rounded-lg shadow-sm border border-green-200">
                    <h3 class="text-lg font-semibold text-green-800 mb-2">Hojas</h3>
                    <p class="text-3xl font-bold text-green-600">D, E, F, G</p>
                    <p class="text-sm text-gray-600 mt-2">Nodos terminales (sin hijos).</p>
                </div>
                
                <!-- Altura -->
                <div class="bg-indigo-50 p-5 rounded-lg shadow-sm border border-indigo-200">
                    <h3 class="text-lg font-semibold text-indigo-800 mb-2">Altura</h3>
                    <p class="text-3xl font-bold text-indigo-600">3</p>
                    <p class="text-sm text-gray-600 mt-2">(Medida en aristas/conexiones)</p>
                </div>
                
            </div>
        </div>

    </div>

</body>
</html>
