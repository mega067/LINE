<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama Estructurado: Calificaciones Neón</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes y Animaciones -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        
        /* Efectos Neón */
        .neon-blue-box {
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.05);
            border: 1px solid #00f3ff;
        }
        .neon-pink-box {
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2), inset 0 0 20px rgba(255, 0, 255, 0.05);
            border: 1px solid #ff00ff;
        }

        /* Flechas de Flujo Animadas */
        .flow-line {
            stroke-dasharray: 10;
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTES VISUALES --- //

        // Flecha simple SVG
        const Arrow = ({ className, direction = "down" }) => {
            const rotations = { down: 0, right: -90, left: 90, up: 180 };
            return (
                <svg className={`w-6 h-6 ${className}`} style={{transform: `rotate(${rotations[direction]}deg)`}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
            );
        };

        // Bloque de Diagrama de Flujo
        const FlowBlock = ({ type, title, content, color, active }) => {
            const baseClass = `relative p-4 rounded-lg border-2 transition-all duration-300 font-code text-xs md:text-sm text-center z-10`;
            const activeClass = active ? `scale-110 bg-${color}-500/10 shadow-[0_0_20px_rgba(var(--c),0.4)]` : 'opacity-60 grayscale';
            
            // Estilos según forma (Rombo para decisión, Rectángulo para proceso)
            if (type === 'decision') {
                return (
                    <div className={`w-32 h-32 flex items-center justify-center transform rotate-45 border-2 ${active ? 'border-yellow-400 bg-yellow-900/20 text-yellow-300' : 'border-gray-700 text-gray-500'} m-4`}>
                        <div className="transform -rotate-45 text-center">
                            <div className="font-bold mb-1">?</div>
                            {content}
                        </div>
                    </div>
                );
            }
            
            // Rectángulo por defecto
            const colorClasses = {
                blue: 'border-[#00f3ff] text-[#00f3ff] shadow-[0_0_10px_#00f3ff]',
                green: 'border-[#00ff00] text-[#00ff00] shadow-[0_0_10px_#00ff00]',
                pink: 'border-[#ff00ff] text-[#ff00ff] shadow-[0_0_10px_#ff00ff]',
                gray: 'border-gray-600 text-gray-400'
            }[color] || 'border-gray-600';

            return (
                <div className={`${baseClass} ${active ? colorClasses : 'border-gray-800 text-gray-600'} bg-black`}>
                    <div className="font-bold mb-1 border-b border-white/10 pb-1">{title}</div>
                    <div>{content}</div>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState(0);

            // Datos
            const N = 8;
            const Arre = [10, 5, 8, 4, 6, 9, 5, 8];
            const S = Arre.reduce((a,b) => a+b, 0);
            const Pro = Math.floor(S / N);
            
            const nextStep = () => setStep(prev => Math.min(prev + 1, 4));
            const prevStep = () => setStep(prev => Math.max(prev - 1, 0));

            return (
                <div className="flex-1 flex flex-col h-screen bg-[#050505] text-white overflow-hidden relative font-sans">
                    <div className="cyber-grid absolute inset-0 pointer-events-none opacity-20"></div>

                    {/* HEADER */}
                    <header className="p-4 border-b border-gray-800 bg-[#0a0a0a] flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-3 h-3 rounded-full bg-[#00f3ff] animate-pulse"></div>
                            <h1 className="font-cyber text-xl md:text-2xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[#00f3ff] to-[#ff00ff]">
                                ESTRUCTURA_ALGORITMO
                            </h1>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={prevStep} disabled={step===0} className="px-4 py-1 border border-gray-700 rounded hover:bg-gray-800 disabled:opacity-30 font-code text-xs">PREV</button>
                             <span className="px-4 py-1 bg-[#00f3ff]/10 border border-[#00f3ff] rounded text-[#00f3ff] font-code font-bold text-xs flex items-center">
                                FASE {step}
                             </span>
                             <button onClick={nextStep} disabled={step===4} className="px-4 py-1 border border-gray-700 rounded hover:bg-gray-800 disabled:opacity-30 font-code text-xs">NEXT</button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        
                        {/* PANEL IZQUIERDO: Pseudocódigo Estructurado */}
                        <div className="w-1/3 border-r border-gray-800 bg-[#080808] p-6 overflow-y-auto hidden md:block z-10">
                            <h3 className="text-gray-500 font-cyber text-xs mb-4">/// CÓDIGO_FUENTE_INTERNO</h3>
                            
                            <div className="font-code text-xs md:text-sm space-y-1">
                                <div className={`pl-2 ${step===0 ? 'bg-[#00f3ff]/20 text-white' : 'text-gray-600'}`}>1. INICIO Variables (N, Arre, S=0)</div>
                                <div className={`pl-2 ${step===1 ? 'bg-[#00f3ff]/20 text-white' : 'text-gray-600'}`}>2. LEER N</div>
                                <div className="pl-2 text-gray-600">3. ...</div>
                                
                                {/* BLOQUE DEL CICLO */}
                                <div className={`mt-4 border-l-2 ${step===2 || step===3 ? 'border-[#ff00ff] bg-[#ff00ff]/5' : 'border-gray-800'} pl-4 py-2 transition-all`}>
                                    <div className="text-[#ff00ff] mb-1 opacity-70">// ESTRUCTURA DEL CICLO</div>
                                    <div className={`${step===2 ? 'text-white font-bold' : 'text-gray-500'}`}>
                                        <span className="text-purple-400">PARA</span> i = 0 <span className="text-purple-400">HASTA</span> N-1 <span className="text-purple-400">HACER</span>:
                                    </div>
                                    <div className={`pl-4 ${step===2 ? 'text-[#00f3ff]' : 'text-gray-600'}`}>
                                        ➢ LEER Calificación (C)
                                    </div>
                                    <div className={`pl-4 ${step===2 ? 'text-[#00f3ff]' : 'text-gray-600'}`}>
                                        ➢ S = S + C  <span className="text-gray-500 text-[10px]">(Acumulador)</span>
                                    </div>
                                    <div className={`pl-4 mt-2 ${step===3 ? 'text-yellow-300' : 'text-gray-600'}`}>
                                        ➢ <span className="text-purple-400">SI</span> (C >= 6) <span className="text-purple-400">ENTONCES</span>:
                                    </div>
                                    <div className={`pl-8 ${step===3 ? 'text-green-400' : 'text-gray-700'}`}>
                                        Aprobados++
                                    </div>
                                    <div className={`pl-4 ${step===3 ? 'text-yellow-300' : 'text-gray-600'}`}>
                                        ➢ <span className="text-purple-400">SINO</span>:
                                    </div>
                                    <div className={`pl-8 ${step===3 ? 'text-red-400' : 'text-gray-700'}`}>
                                        Reprobados++
                                    </div>
                                    <div className="text-purple-400 text-[10px] mt-1">FIN_PARA</div>
                                </div>

                                <div className={`mt-4 pl-2 ${step===4 ? 'bg-[#00f3ff]/20 text-white' : 'text-gray-600'}`}>5. CALCULAR Promedio = S / N</div>
                                <div className={`pl-2 ${step===4 ? 'bg-[#00f3ff]/20 text-white' : 'text-gray-600'}`}>6. IMPRIMIR Resultados</div>
                            </div>
                        </div>

                        {/* PANEL DERECHO: Diagrama Visual */}
                        <div className="flex-1 bg-[#050505] relative flex flex-col items-center justify-center p-4">
                            
                            {/* Visualización del Array siempre visible pero destacada según paso */}
                            <div className="absolute top-4 left-0 w-full flex justify-center z-0">
                                <div className="flex gap-1 md:gap-2 p-4 bg-[#111] rounded-xl border border-gray-800">
                                    {Arre.map((val, idx) => (
                                        <div key={idx} className="flex flex-col items-center group">
                                            {/* Puntero del ciclo */}
                                            <div className={`text-[#ff00ff] text-xs font-code mb-1 transition-opacity duration-300 ${step >= 2 && step <= 3 ? 'opacity-100' : 'opacity-0'}`}>
                                                i={idx}
                                                <Arrow className="w-3 h-3 mx-auto text-[#ff00ff]" />
                                            </div>
                                            
                                            {/* Caja de valor */}
                                            <div className={`
                                                w-8 h-10 md:w-10 md:h-12 border rounded flex items-center justify-center font-bold text-sm md:text-base font-code transition-all duration-500
                                                ${step === 0 ? 'border-gray-800 text-gray-700' : ''}
                                                ${step === 1 ? 'border-[#00f3ff] text-white' : ''}
                                                ${(step === 2 || step === 3) ? 'border-[#ff00ff] shadow-[0_0_10px_#ff00ff]' : ''}
                                                ${step === 4 ? (val >= 6 ? 'border-green-500 text-green-500' : 'border-red-500 text-red-500') : ''}
                                            `}>
                                                {step === 0 ? '?' : val}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* ZONA DE DIAGRAMAS - Cambia según el paso */}
                            <div className="mt-20 w-full h-full flex items-center justify-center relative">
                                
                                {/* PASO 0 & 1: INICIO */}
                                {(step === 0 || step === 1) && (
                                    <div className="flex flex-col items-center animate-[fadeIn_0.5s]">
                                        <FlowBlock 
                                            title="INICIO" 
                                            content="Reserva Memoria para N y Arreglo[]" 
                                            color="blue" 
                                            active={true} 
                                        />
                                        <Arrow className="text-gray-600 my-2" />
                                        <FlowBlock 
                                            title="INPUT" 
                                            content={`Usuario define N = ${N}`} 
                                            color="blue" 
                                            active={step === 1} 
                                        />
                                    </div>
                                )}

                                {/* PASO 2: ESTRUCTURA DEL CICLO (ACUMULADOR) */}
                                {step === 2 && (
                                    <div className="relative w-full max-w-2xl h-[400px] border border-gray-800 rounded-xl bg-[#0a0a0a] p-4 flex flex-col items-center justify-center animate-[fadeIn_0.5s]">
                                        <div className="absolute top-2 left-2 text-[#ff00ff] font-cyber text-xs">VISUALIZACIÓN DEL BUCLE</div>
                                        
                                        {/* Línea que representa el ciclo */}
                                        <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-30">
                                            <path d="M 100 200 Q 50 200 50 100 T 100 50" fill="none" stroke="#ff00ff" strokeWidth="2" strokeDasharray="5,5" />
                                            <text x="60" y="150" fill="#ff00ff" fontSize="10" className="font-code">REPETIR N VECES</text>
                                        </svg>

                                        <div className="flex items-center gap-8">
                                            <div className="flex flex-col items-center">
                                                <div className="text-gray-400 text-xs mb-2">DATO ENTRANTE (C)</div>
                                                <div className="w-16 h-16 border-2 border-white rounded flex items-center justify-center text-2xl font-bold animate-pulse">
                                                    {Arre[2]}
                                                </div>
                                            </div>
                                            
                                            <Arrow direction="right" className="text-[#00f3ff] w-8 h-8" />
                                            
                                            <div className="flex flex-col items-center p-4 border border-[#00f3ff] bg-[#00f3ff]/5 rounded-lg">
                                                <div className="text-[#00f3ff] text-xs mb-1 font-cyber">PROCESO: SUMA</div>
                                                <div className="font-code text-lg">S = S + C</div>
                                                <div className="mt-2 text-gray-400 text-xs">Acumulando total...</div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* PASO 3: ESTRUCTURA DEL CICLO (DECISIÓN) */}
                                {step === 3 && (
                                    <div className="relative w-full max-w-3xl h-[400px] border border-gray-800 rounded-xl bg-[#0a0a0a] p-4 flex flex-col items-center animate-[fadeIn_0.5s]">
                                        <div className="absolute top-2 left-2 text-yellow-400 font-cyber text-xs">LÓGICA DE DECISIÓN</div>
                                        
                                        {/* Diagrama de Flujo Condicional */}
                                        <div className="flex flex-col items-center mt-8">
                                            <div className="border border-white px-4 py-2 rounded text-sm mb-2">DATO: {Arre[2]}</div>
                                            <Arrow className="text-gray-500" />
                                            
                                            {/* Rombo */}
                                            <FlowBlock type="decision" content="¿ >= 6 ?" active={true} />
                                            
                                            <div className="flex justify-between w-[300px] relative -mt-8">
                                                {/* Rama SI */}
                                                <div className="flex flex-col items-center">
                                                    <div className="h-8 w-0.5 bg-green-500 absolute left-[25%] top-[50%] transform -rotate-45 origin-top"></div>
                                                    <div className="mt-16 text-green-400 font-bold text-xs mb-2">VERDADERO</div>
                                                    <FlowBlock title="CONTADOR A" content="Aprobados + 1" color="green" active={true} />
                                                </div>

                                                {/* Rama NO */}
                                                <div className="flex flex-col items-center">
                                                    <div className="h-8 w-0.5 bg-red-500 absolute right-[25%] top-[50%] transform rotate-45 origin-top"></div>
                                                    <div className="mt-16 text-red-400 font-bold text-xs mb-2">FALSO</div>
                                                    <FlowBlock title="CONTADOR B" content="Reprobados + 1" color="gray" active={false} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* PASO 4: RESULTADOS */}
                                {step === 4 && (
                                    <div className="w-full max-w-2xl grid grid-cols-2 gap-4 animate-[zoomIn_0.5s]">
                                        <div className="col-span-2 text-center mb-4">
                                            <h2 className="text-2xl font-cyber text-white">SALIDA DEL SISTEMA</h2>
                                            <p className="text-gray-500 font-code text-xs">Ciclos finalizados. Memoria liberada.</p>
                                        </div>
                                        
                                        <FlowBlock 
                                            title="PROMEDIO" 
                                            content={`Suma Total (${S}) / N (${N}) = ${Pro}`} 
                                            color="blue" 
                                            active={true} 
                                        />
                                        <FlowBlock 
                                            title="ESTADÍSTICAS" 
                                            content="Cálculo de % Completado" 
                                            color="pink" 
                                            active={true} 
                                        />
                                        
                                        <div className="col-span-2 mt-4 p-4 border border-dashed border-gray-700 rounded bg-[#111] font-code text-xs text-left">
                                            <div className="text-green-400">> Output: Promedio general: {Pro}</div>
                                            <div className="text-green-400">> Output: Aprobados: {Arre.filter(x=>x>=6).length}</div>
                                            <div className="text-green-400 animate-pulse">> _</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
