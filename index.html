<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solucionario: Hexadecimal a Decimal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Iconos simples
        const IconHash = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>;
        const IconArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;

        const HexToDecSolver = () => {
            const exercises = [
                { id: 1, hex: "15" },
                { id: 2, hex: "89A" },
                { id: 3, hex: "66FF" },
                { id: 4, hex: "ABC" },
                { id: 5, hex: "BEBE" },
                { id: 6, hex: "FA9" },
                { id: 7, hex: "88BE" }
            ];

            const [selectedIndex, setSelectedIndex] = useState(0);

            // Utilidades
            const hexToVal = (char) => {
                const map = { 'A': 10, 'B': 11, 'C': 12, 'D': 13, 'E': 14, 'F': 15 };
                return map[char] || parseInt(char);
            };

            const currentHex = exercises[selectedIndex].hex;
            const digits = currentHex.split('').reverse(); // Invertimos para procesar desde potencia 0
            
            // Calcular total
            const total = digits.reduce((acc, char, index) => acc + (hexToVal(char) * Math.pow(16, index)), 0);

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* Header */}
                    <header className="bg-emerald-700 text-white p-4 shadow-lg z-10 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <IconHash />
                            <h1 className="text-xl font-bold">Conversor Hexadecimal ➔ Decimal</h1>
                        </div>
                        <div className="text-xs bg-emerald-800 px-3 py-1 rounded-full opacity-80 hidden md:block">
                            Método de Notación Desarrollada
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar */}
                        <aside className="w-64 bg-white border-r border-slate-200 overflow-y-auto hidden md:block z-10">
                            <div className="p-4 bg-slate-50 border-b border-slate-200">
                                <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Ejercicios</h2>
                            </div>
                            <ul>
                                {exercises.map((ex, idx) => (
                                    <li key={ex.id}>
                                        <button 
                                            onClick={() => setSelectedIndex(idx)}
                                            className={`w-full text-left px-4 py-3 border-b border-slate-100 hover:bg-emerald-50 transition-colors flex justify-between items-center ${selectedIndex === idx ? 'bg-emerald-50 border-l-4 border-l-emerald-600 text-emerald-900 font-medium' : 'text-slate-600'}`}
                                        >
                                            <span>#{idx + 1}. <span className="font-mono text-lg ml-2">{ex.hex}</span></span>
                                            {selectedIndex === idx && <div className="w-2 h-2 bg-emerald-500 rounded-full"></div>}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </aside>

                        {/* Vista Móvil Selector */}
                        <div className="md:hidden absolute top-14 left-0 right-0 z-20 bg-white p-2 shadow-md border-b">
                            <select 
                                className="w-full p-2 border rounded bg-slate-50 font-mono text-lg"
                                value={selectedIndex}
                                onChange={(e) => setSelectedIndex(Number(e.target.value))}
                            >
                                {exercises.map((ex, idx) => (
                                    <option key={ex.id} value={idx}>Ejercicio #{idx+1}: {ex.hex}</option>
                                ))}
                            </select>
                        </div>

                        {/* Área de Trabajo */}
                        <main className="flex-1 overflow-y-auto bg-slate-100 p-4 md:p-8">
                            <div className="max-w-4xl mx-auto pb-20">
                                
                                {/* Tarjeta Resultado */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="text-center md:text-left">
                                        <div className="text-sm text-slate-400 font-bold uppercase mb-1">Hexadecimal</div>
                                        <div className="text-5xl md:text-6xl font-mono font-bold text-slate-800 tracking-tight">
                                            {currentHex}<span className="text-lg text-slate-400 ml-1">16</span>
                                        </div>
                                    </div>
                                    <IconArrowRight />
                                    <div className="text-center md:text-right">
                                        <div className="text-sm text-emerald-600 font-bold uppercase mb-1">Decimal</div>
                                        <div className="text-5xl md:text-6xl font-mono font-bold text-emerald-600 tracking-tight">
                                            {total}<span className="text-lg text-emerald-400 ml-1">10</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Visualización del Proceso */}
                                <div className="space-y-4">
                                    <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                        <span className="bg-slate-200 text-slate-600 w-6 h-6 rounded flex items-center justify-center text-sm">1</span>
                                        Desglose por Posiciones
                                    </h3>

                                    {/* Contenedor de Tarjetas de Dígitos */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {[...digits].reverse().map((char, idx) => {
                                            // Calcular el índice real (invertido de nuevo para mostrar izquierda a derecha)
                                            const power = digits.length - 1 - idx;
                                            const val = hexToVal(char);
                                            const result = val * Math.pow(16, power);
                                            
                                            return (
                                                <div key={idx} className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm relative overflow-hidden fade-in-up" style={{animationDelay: `${idx * 100}ms`}}>
                                                    {/* Número de fondo decorativo */}
                                                    <div className="absolute -right-2 -top-2 text-9xl font-black text-slate-50 opacity-5 pointer-events-none">
                                                        {power}
                                                    </div>

                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="w-12 h-12 rounded-lg bg-emerald-100 text-emerald-800 text-2xl font-bold flex items-center justify-center border border-emerald-200">
                                                            {char}
                                                        </div>
                                                        <div className="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-500">
                                                            Posición {power}
                                                        </div>
                                                    </div>

                                                    <div className="space-y-2 text-sm font-mono">
                                                        {/* Conversión si es letra */}
                                                        {['A','B','C','D','E','F'].includes(char) && (
                                                            <div className="flex justify-between text-slate-400 border-b border-slate-100 pb-1">
                                                                <span>Letra → Valor:</span>
                                                                <span className="text-slate-800 font-bold">{val}</span>
                                                            </div>
                                                        )}
                                                        
                                                        {/* Operación */}
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-slate-500">{val} × 16<sup>{power}</sup></span>
                                                        </div>
                                                        
                                                        {/* Resultado Parcial */}
                                                        <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                                            <span className="font-bold text-slate-400">=</span>
                                                            <span className="font-bold text-emerald-600 text-lg">{result}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Sumatoria Final */}
                                    <div className="mt-8 bg-slate-800 text-white rounded-xl p-6 shadow-lg fade-in-up" style={{animationDelay: '600ms'}}>
                                        <h3 className="text-sm font-bold text-slate-400 uppercase mb-4 border-b border-slate-700 pb-2">Sumatoria Final</h3>
                                        <div className="font-mono text-lg md:text-xl leading-relaxed text-slate-300 break-words">
                                            {digits.map((char, idx) => {
                                                 const val = hexToVal(char);
                                                 const power = idx; // Aquí usamos el índice original invertido (0, 1, 2...)
                                                 return (
                                                     <span key={idx} className="inline-block mr-1">
                                                         ({val} × 16<sup>{power}</sup>) {idx < digits.length - 1 ? '+' : ''}
                                                     </span>
                                                 );
                                            }).reverse()}
                                        </div>
                                        <div className="mt-4 pt-4 border-t border-slate-700 flex justify-end items-baseline gap-3">
                                            <span className="text-2xl text-slate-400">=</span>
                                            <span className="text-4xl font-bold text-emerald-400">{total}</span>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HexToDecSolver />);
    </script>
</body>
</html>
