<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarrón Neón: Calificaciones</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes y Animaciones -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e0e0e0;
        }
        .font-tech {
            font-family: 'Orbitron', sans-serif;
        }
        .font-code {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Efecto Neón */
        .neon-text-blue {
            text-shadow: 0 0 5px #3b82f6, 0 0 10px #3b82f6;
        }
        .neon-box-blue {
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3), inset 0 0 20px rgba(59, 130, 246, 0.05);
        }
        
        .neon-text-pink {
            text-shadow: 0 0 5px #ec4899, 0 0 10px #ec4899;
        }
        .neon-box-pink {
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        /* Grid de fondo animado */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(50, 50, 50, 0.5) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(50, 50, 50, 0.5) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        @keyframes pulse-border {
            0% { border-color: rgba(59, 130, 246, 0.4); }
            50% { border-color: rgba(59, 130, 246, 1); }
            100% { border-color: rgba(59, 130, 246, 0.4); }
        }
        .animate-pulse-border {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- ICONOS SVG (Estilo Neón) ---
        const IconBase = ({ children, className }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" strokeWidth="2" 
                strokeLinecap="round" strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const ArrowDown = (props) => <IconBase {...props}><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconBase>;
        const TerminalIcon = (props) => <IconBase {...props}><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></IconBase>;

        // --- COMPONENTE PRINCIPAL ---
        const PizarronCalificaciones = () => {
            const [step, setStep] = useState(0);

            // Datos
            const calificaciones = [10, 5, 8, 9, 4, 6, 7, 10, 5, 8];
            const N = calificaciones.length;
            
            // Lógica
            const suma = calificaciones.reduce((a, b) => a + b, 0);
            const promedioEntero = Math.floor(suma / N);
            const promedioDecimal = (suma / N).toFixed(1);
            
            const aprobados = calificaciones.filter(c => c >= 6);
            const reprobados = calificaciones.filter(c => c < 6);
            const mayoresOcho = calificaciones.filter(c => c >= 8);

            const porcAprobados = ((aprobados.length / N) * 100).toFixed(1);
            const porcReprobados = ((reprobados.length / N) * 100).toFixed(1);

            const nextStep = () => setStep(prev => Math.min(prev + 1, 4));
            const prevStep = () => setStep(prev => Math.max(prev - 1, 0));

            // ESTILOS NEÓN REUTILIZABLES
            // Caja "cristal" con borde neón
            const neonCard = "bg-gray-900/80 backdrop-blur-md border border-gray-700 rounded-xl p-6 transition-all duration-300 relative overflow-hidden";
            const neonCardBlue = `${neonCard} border-blue-500/30 hover:border-blue-400 hover:shadow-[0_0_20px_rgba(59,130,246,0.2)]`;
            const neonCardPink = `${neonCard} border-pink-500/30 hover:border-pink-400 hover:shadow-[0_0_20px_rgba(236,72,153,0.2)]`;
            const neonCardGreen = `${neonCard} border-green-500/30 hover:border-green-400 hover:shadow-[0_0_20px_rgba(34,197,94,0.2)]`;
            const neonCardYellow = `${neonCard} border-yellow-500/30 hover:border-yellow-400 hover:shadow-[0_0_20px_rgba(234,179,8,0.2)]`;

            return (
                <div className="min-h-screen bg-[#050505] text-gray-200 p-4 font-sans overflow-y-auto pb-20 relative selection:bg-pink-500 selection:text-white">
                    
                    {/* Fondo de malla cyber */}
                    <div className="fixed inset-0 cyber-grid pointer-events-none z-0"></div>

                    <div className="max-w-5xl mx-auto relative z-10">
                        
                        {/* Header */}
                        <div className="flex flex-col md:flex-row items-center justify-between mb-8 border-b border-gray-800 pb-6">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-gray-800 rounded-lg flex items-center justify-center border border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                                    <TerminalIcon className="text-blue-400" />
                                </div>
                                <div>
                                    <h1 className="text-3xl md:text-4xl font-bold text-white font-tech tracking-wider neon-text-blue">
                                        SYSTEM<span className="text-pink-500">_GRADES</span>
                                    </h1>
                                    <p className="text-blue-300/70 text-sm font-code flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                        ONLINE // N = {N} ESTUDIANTES
                                    </p>
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="flex items-center gap-4 mt-6 md:mt-0 bg-gray-900/90 p-2 rounded-full border border-gray-700 shadow-xl">
                                <button 
                                    onClick={prevStep} 
                                    disabled={step === 0}
                                    className={`px-4 py-2 rounded-full font-bold transition-all font-tech text-sm flex items-center gap-2 ${step === 0 ? 'text-gray-600 cursor-not-allowed' : 'text-blue-400 hover:bg-blue-500/10 hover:text-blue-300'}`}
                                >
                                    <span>◄</span> PREV
                                </button>
                                
                                <div className="px-4 py-1 bg-black rounded-md border border-gray-800 font-code text-pink-500 min-w-[100px] text-center">
                                    STEP_0{step + 1}
                                </div>

                                <button 
                                    onClick={nextStep} 
                                    disabled={step === 4}
                                    className={`px-4 py-2 rounded-full font-bold transition-all font-tech text-sm flex items-center gap-2 ${step === 4 ? 'text-gray-600 cursor-not-allowed' : 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.5)] hover:bg-blue-500 hover:shadow-[0_0_25px_rgba(37,99,235,0.7)]'}`}
                                >
                                    NEXT <span>►</span>
                                </button>
                            </div>
                        </div>

                        {/* Área Principal Estilo "Pantalla" */}
                        <div className="border border-gray-800 bg-[#0a0a0a] rounded-2xl min-h-[600px] relative shadow-2xl p-6 md:p-10 overflow-hidden">
                            {/* Linea de scan decorativa */}
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-20 animate-[pulse_3s_ease-in-out_infinite]"></div>

                            {/* PASO 1: INPUT DATA */}
                            <div className={`transition-all duration-700 ${step >= 0 ? 'opacity-100 translate-y-0' : 'opacity-30 blur-sm translate-y-10 hidden'}`}>
                                <div className="flex flex-col items-center mb-16">
                                    <div className="mb-8 text-center relative">
                                        <div className="inline-block px-6 py-2 bg-blue-500/10 border-l-4 border-blue-500 text-blue-300 font-code text-sm mb-4 backdrop-blur-sm">
                                            > INICIANDO LECTURA DE DATOS...
                                        </div>
                                        <div className="text-gray-400 text-xs font-code mt-1">Scanner: Active</div>
                                    </div>
                                    
                                    <div className="flex flex-wrap justify-center gap-3 md:gap-4 max-w-3xl">
                                        {calificaciones.map((calif, idx) => (
                                            <div key={idx} className="group relative">
                                                {/* Efecto Glow detrás */}
                                                <div className={`absolute inset-0 rounded-lg blur opacity-20 group-hover:opacity-60 transition-opacity ${calif >= 6 ? 'bg-blue-500' : 'bg-red-500'}`}></div>
                                                
                                                <div className={`relative w-14 h-14 md:w-16 md:h-16 border rounded-lg flex items-center justify-center text-xl md:text-2xl font-bold font-tech transition-all duration-300 z-10 bg-gray-900 ${calif >= 6 ? 'border-blue-500/50 text-blue-400 group-hover:border-blue-400 group-hover:text-white' : 'border-red-500/50 text-red-500 group-hover:border-red-400 group-hover:text-white'}`}>
                                                    {calif}
                                                </div>
                                                
                                                {/* Etiqueta ID */}
                                                <div className="absolute -bottom-6 left-0 w-full text-center">
                                                    <span className="text-[9px] font-code text-gray-600 uppercase tracking-widest group-hover:text-gray-400">ID_{idx + 1}</span>
                                                </div>

                                                {/* Indicador de "Destacado" */}
                                                {calif >= 8 && step >= 3 && (
                                                    <div className="absolute -top-2 -right-2 z-20">
                                                        <div className="relative">
                                                            <div className="absolute inset-0 bg-yellow-400 rounded-full blur-sm opacity-50 animate-pulse"></div>
                                                            <div className="bg-yellow-500 text-black p-1 rounded-full shadow-lg relative">
                                                                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* PASO 2: PROCESAMIENTO (Suma y Clasificación) */}
                            {step >= 1 && (
                                <div className="flex flex-col items-center mb-16 animate-[fadeIn_0.7s_ease-out]">
                                    <ArrowDown className="w-8 h-8 text-gray-700 mb-6 animate-bounce" />
                                    
                                    <div className="grid md:grid-cols-2 gap-6 w-full max-w-4xl">
                                        
                                        {/* Bloque Acumulador */}
                                        <div className={neonCardYellow}>
                                            <div className="absolute top-0 right-0 p-2 opacity-10 text-yellow-500">
                                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
                                            </div>
                                            <h3 className="font-tech text-yellow-500 text-lg mb-4 flex items-center gap-2">
                                                <span className="w-2 h-2 bg-yellow-500 rounded-full"></span> ACUMULADOR
                                            </h3>
                                            <div className="flex justify-between items-end border-b border-gray-700 pb-2 mb-2">
                                                <span className="text-gray-400 font-code text-xs">var S = S + C;</span>
                                                <span className="text-3xl font-bold text-white neon-text-blue">{suma}</span>
                                            </div>
                                            <div className="text-right text-[10px] text-gray-500 font-code tracking-widest">TOTAL SCORE</div>
                                        </div>

                                        {/* Bloque Clasificación */}
                                        <div className={neonCardBlue}>
                                             <div className="absolute top-0 right-0 p-2 opacity-10 text-blue-500">
                                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                                            </div>
                                            <h3 className="font-tech text-blue-400 text-lg mb-4 flex items-center gap-2">
                                                <span className="w-2 h-2 bg-blue-500 rounded-full"></span> CONTADORES
                                            </h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-gray-800/50 p-2 rounded border border-green-500/20 text-center">
                                                    <div className="text-[10px] text-green-500 mb-1 font-bold">PASS (>6)</div>
                                                    <div className="text-2xl font-bold text-white">{aprobados.length}</div>
                                                </div>
                                                <div className="bg-gray-800/50 p-2 rounded border border-red-500/20 text-center">
                                                    <div className="text-[10px] text-red-500 mb-1 font-bold">FAIL (&lt;6)</div>
                                                    <div className="text-2xl font-bold text-white">{reprobados.length}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* PASO 3: CÁLCULOS (Promedio) */}
                            {step >= 2 && (
                                <div className="flex flex-col items-center mb-16 animate-[fadeIn_0.7s_ease-out]">
                                    <ArrowDown className="w-8 h-8 text-gray-700 mb-6" />
                                    
                                    <div className={`${neonCardPink} w-full max-w-2xl`}>
                                        <h3 className="font-tech text-pink-400 text-lg mb-6 text-center tracking-widest">
                                            // PROCESANDO ESTADÍSTICAS
                                        </h3>
                                        
                                        <div className="grid md:grid-cols-2 gap-8 items-center">
                                            {/* Promedio */}
                                            <div className="text-center border-r border-gray-700 pr-4">
                                                <div className="text-xs text-pink-300/50 font-code mb-2">AVERAGE_CALC()</div>
                                                <div className="text-4xl font-bold text-white neon-text-pink mb-1">
                                                    {promedioEntero}
                                                </div>
                                                <div className="text-[10px] text-gray-500 font-mono">
                                                    Exact: {promedioDecimal}
                                                </div>
                                            </div>

                                            {/* Barras de Porcentaje */}
                                            <div className="space-y-4">
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-code mb-1 text-gray-400">
                                                        <span>APROBADOS</span>
                                                        <span className="text-green-400">{porcAprobados}%</span>
                                                    </div>
                                                    <div className="h-2 bg-gray-800 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-green-600 to-green-400 shadow-[0_0_10px_#22c55e]" style={{width: `${porcAprobados}%`}}></div>
                                                    </div>
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] font-code mb-1 text-gray-400">
                                                        <span>REPROBADOS</span>
                                                        <span className="text-red-400">{porcReprobados}%</span>
                                                    </div>
                                                    <div className="h-2 bg-gray-800 rounded-full overflow-hidden">
                                                        <div className="h-full bg-gradient-to-r from-red-600 to-red-400 shadow-[0_0_10px_#ef4444]" style={{width: `${porcReprobados}%`}}></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                             {/* PASO 4: HONOR ROLL (>=8) */}
                            {step >= 3 && (
                                <div className="flex flex-col items-center mb-16 animate-[fadeIn_0.7s_ease-out]">
                                    <ArrowDown className="w-8 h-8 text-gray-700 mb-6" />
                                    
                                    <div className="relative group">
                                        <div className="absolute -inset-0.5 bg-gradient-to-r from-yellow-600 to-orange-600 rounded-lg blur opacity-30 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
                                        <div className="relative bg-black border border-yellow-600/30 rounded-lg p-6 flex items-center gap-6 max-w-lg">
                                            <div className="p-3 bg-yellow-900/20 rounded-full border border-yellow-500/50">
                                                <Award className="text-yellow-400 w-8 h-8" />
                                            </div>
                                            <div>
                                                <h4 className="text-yellow-500 font-tech font-bold text-lg">HIGH PERFORMANCE</h4>
                                                <p className="text-gray-400 text-xs font-code mb-2">Query: Grades >= 8</p>
                                                <div className="flex gap-2 mt-2">
                                                    {mayoresOcho.map((v, i) => (
                                                        <span key={i} className="text-xs font-bold bg-yellow-500/20 text-yellow-200 border border-yellow-500/30 px-2 py-1 rounded">
                                                            {v}
                                                        </span>
                                                    ))}
                                                    <span className="ml-2 text-xs text-gray-500 flex items-center">
                                                        Total: {mayoresOcho.length}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* PASO 5: REPORTE FINAL */}
                            {step >= 4 && (
                                <div className="flex flex-col items-center animate-[popIn_0.5s_cubic-bezier(0.175,0.885,0.32,1.275)] pb-10">
                                    <ArrowDown className="w-8 h-8 text-gray-700 mb-6" />
                                    
                                    <div className="relative w-full max-w-md">
                                        {/* Borde brillante animado */}
                                        <div className="absolute inset-0 rounded-xl border-2 border-blue-500 opacity-50 blur-md"></div>
                                        
                                        <div className="relative bg-gray-900 border-2 border-blue-500/50 rounded-xl p-8 shadow-[0_0_50px_rgba(59,130,246,0.15)] overflow-hidden">
                                            {/* Fondo terminal */}
                                            <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMTAxMDEwIiAvPgo8cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjMjAyMDIwIiAvPgo8L3N2Zz4=')] opacity-50"></div>
                                            
                                            <div className="relative z-10">
                                                <div className="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                                                    <h4 className="font-tech text-2xl text-white neon-text-blue">FINAL_REPORT</h4>
                                                    <span className="text-xs bg-green-900/30 text-green-400 border border-green-500/30 px-2 py-1 rounded font-code">STATUS: COMPLETE</span>
                                                </div>
                                                
                                                <div className="space-y-4 font-code text-sm">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-gray-400">Average Grade</span>
                                                        <span className="text-xl font-bold text-white">{promedioEntero}</span>
                                                    </div>
                                                    
                                                    <div className="h-px bg-gray-800 my-2"></div>
                                                    
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-gray-400">Passed</span>
                                                        <span className="text-green-400 font-bold">{aprobados.length} <span className="text-[10px] opacity-70">({porcAprobados}%)</span></span>
                                                    </div>
                                                    
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-gray-400">Failed</span>
                                                        <span className="text-red-400 font-bold">{reprobados.length} <span className="text-[10px] opacity-70">({porcReprobados}%)</span></span>
                                                    </div>
                                                    
                                                    <div className="h-px bg-gray-800 my-2"></div>

                                                    <div className="flex justify-between items-center text-yellow-500">
                                                        <span>Top Students (>=8)</span>
                                                        <span className="font-bold border border-yellow-500/30 bg-yellow-500/10 px-2 rounded">{mayoresOcho.length}</span>
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-8 text-center">
                                                    <p className="text-[10px] text-gray-600 font-code animate-pulse">
                                                        > SYSTEM SHUTDOWN PENDING...
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PizarronCalificaciones />);
    </script>
</body>
</html>
